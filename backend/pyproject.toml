# Tool configuration only - the backend is run directly, not packaged.

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers are meant to be used as argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Cookie"]

[tool.ruff.lint.per-file-ignores]
# pytest uses bare asserts.
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
